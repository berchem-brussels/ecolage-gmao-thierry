name: tests
on:
  pull_request:
  push:
    branches: [main]
# 0.21.5 (E-51, DV-196) : le jeton de GitHub ne reçoit que la lecture du code (alerte CodeQL n° 11) ; écart à GITHUB.md, section 7.
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Serveur
        working-directory: backend
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Interface
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npm run a11y
